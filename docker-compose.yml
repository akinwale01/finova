services:
  postgres:
    image: postgres:16
    container_name: finova-postgres
    restart: always

    environment:
      POSTGRES_USER: finova_user
      POSTGRES_PASSWORD: finova_password
      POSTGRES_DB: finova_db

    ports:
      - "55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: